<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>DailyXP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="notice" role="status" aria-live="polite"></div>
    <div id="day-block-reminder" role="status" aria-live="polite" hidden></div>
    <div id="app"></div>
    <dialog id="editor">
      <form id="edit-form">
        <div class="dialog-top">
          <h2 id="editor-title"></h2>
          <button
            type="button"
            data-action="close-editor"
            aria-label="Close editor"
          >
            ×
          </button>
        </div>
        <div id="fields"></div>
        <p id="form-error" role="alert"></p>
        <button class="primary" type="submit">Save</button>
      </form>
    </dialog>
    <dialog
      id="private-confirmation"
      aria-labelledby="private-title"
      aria-describedby="private-copy"
    >
      <h2 id="private-title"></h2>
      <p id="private-copy" class="hint"></p>
      <div class="inline">
        <button type="button" data-action="cancel-private">Cancel</button
        ><button
          type="button"
          data-action="confirm-private"
          class="primary"
          id="private-accept"
        >
          Open private tracks
        </button>
      </div>
    </dialog>
    <dialog
      id="reset-confirmation"
      aria-labelledby="reset-title"
      aria-describedby="reset-copy"
    >
      <h2 id="reset-title">Reset this profile?</h2>
      <p id="reset-copy">
        Your Tasks, Goals, Habits, Sessions, private tracks and settings will be
        cleared. Export first if you need a portable copy.
      </p>
      <p id="reset-error" role="alert"></p>
      <div class="inline">
        <button type="button" data-action="cancel-reset">Cancel</button
        ><button type="button" class="danger" data-action="confirm-reset">
          Clear this profile
        </button>
      </div>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
